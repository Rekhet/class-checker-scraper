# Syllabus attachment links on GitHub-hosted runners.
#
# For every class of the target terms (collect.env COUNT_YEAR/COUNT_SEM plus
# UPCOMING_TERMS) the sugang syllabus page is asked which files are attached
# (names and download numbers only; no syllabus text is kept). One row per
# term goes to the cloud table syllabus_attach_snapshots
# (scraper/syllabus_attach.py). The local scheduled update (06:00, 12:00,
# 18:00 KST) pulls changed terms and publishes web/data/syllabus/; it does
# not read sugang for this.
#
# Runs daily at 01:40 KST (about 66 min; GitHub started the first scheduled run
# 2 h late, so this leaves room before the 06:00 update). GitHub cron is best-effort; the
# local pull reports a target term not refreshed for 48 h, which also covers
# GitHub disabling the schedule after 60 days without repository activity.
#
# Manual runs: `past` collects the past terms (2020 on) that have no row yet,
# instead of the targets (about 8.7 h, so two runs under the 6 h timeout; each
# rerun skips stored terms); `force` bypasses the 90% shrink
# guard and, with `past`, also re-collects terms that already have a row.
name: collect-syllabus

on:
  schedule:
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      past:
        description: "Collect past terms without a row instead of the targets (about 8.7 h: rerun once after the 6 h timeout)"
        type: boolean
        default: false
      force:
        description: "Bypass the 90% shrink guard; with past, also re-collect stored terms"
        type: boolean
        default: false

concurrency:
  group: collect-syllabus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra turso

      - name: Collect syllabus attachments
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ARGS: ${{ inputs.past && '--past' || '' }} ${{ inputs.force && '--force' || '' }}
        run: |
          set -a; . ./collect.env; set +a
          uv run python -m scraper.syllabus_attach collect $ARGS
